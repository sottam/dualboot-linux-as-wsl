# /etc/wsl.conf of the physical root. Read only by WSL; the native boot ignores it.
# WSL must not rewrite the native resolv.conf or hosts, nor mount the native fstab
# (ESP, swap). WSL always rewrites /etc/hostname at boot: set it to the native hostname.
[boot]
systemd=true

[network]
hostname=CHANGE-ME-native-hostname
generateResolvConf=false
generateHosts=false

[automount]
mountFsTab=false

[user]
default=CHANGE-ME-user
